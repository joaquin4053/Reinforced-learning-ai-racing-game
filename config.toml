# Konfiguration der Simulation: alle Physik-Werte, Regel-Grenzen, Sensoren und Versionsnummern.
#
# WICHTIG (Regel R8): Wer hier etwas ändert, erhöht die passende Versionsnummer!
#   [simulation], [auto], [antrieb], [reifen], [lenkung], [drift], [luft], [kollision] -> physik
#   [regeln]                                                                         -> regeln
#   [sensoren]                                                                       -> sensoren
# Die Version einer Strecke steht in der Strecken-Datei selbst (tracks/<map>.json, "version").
#
# Spiel v2 (3D, Strecke aus Bausteinen, Runterfallen = Crash). Die Nummern zählen vom alten Spiel
# (archiv/spiel_v1) weiter, damit Ergebnisse nie verwechselt werden.

[versionen]
physik = 14     # 7: 3D-Spiel, 8: Randwulst, 9: Fahrleistung, Steilkurven, Drehen in der Luft, 10: hoher Rand, 11: max. Steigung, 12: niedrige Kante, Abheben über Kuppen, 13: schwereres Auto, 14: Mittelweg Schwere 1.3, stärkere Bremse
regeln = 4      # 3: Runterfallen = Crash (R2 geändert am 2026-10-18), 4: R5 um Steigung/Luft/senkrechtes Tempo ergänzt
sensoren = 5    # 3: Strahlen messen Abstand zur Streckenkante, dazu Steigung, Luft, Tempo vertikal; 4: tempo_norm 75; 5: tempo_norm 110

[simulation]
physik_hz = 60          # Physik-Schritte pro Sekunde (Zeitschritt = 1/60 s)
unterschritte = 4       # interne Teilschritte pro Physik-Schritt
gravitation = 9.81      # m/s²

[auto]
mass = 1100.0           # kg
inertia = 1700.0        # kg·m² Drehträgheit um die Hochachse
cg_to_front = 1.2       # m Schwerpunkt -> Vorderachse
cg_to_rear = 1.3        # m Schwerpunkt -> Hinterachse
cg_height = 0.30        # m Schwerpunkthöhe (Gewichtsverlagerung beim Bremsen)
suspension_time = 0.12  # s bis sich das Gewicht verlagert hat
length = 4.0            # m
width = 2.0             # m
track_width = 1.7       # m Abstand linke/rechte Räder (für Quer-Neigung)

[antrieb]
engine_power = 600000.0     # W (Arcade: sehr spritzig, Beschleunigung fällt mit dem Tempo)
max_drive_force = 21000.0   # N Traktionsgrenze beim Anfahren (~19 m/s², fast 2 g)
brake_force = 32000.0       # N bei voller Bremse (~3 g, Arcade: bremst stärker als es beschleunigt)
reverse_force = 4500.0      # N Bremse im Stand = rückwärts
max_reverse = 10.0          # m/s
drag = 0.32                 # Luftwiderstand F = drag · v²  -> Höchsttempo ca. 380 km/h
rolling = 20.0              # Rollwiderstand F = rolling · v
engine_brake = 3000.0       # N Motorbremse ohne Gas (man rollt nicht einfach weiter)
downforce = 1.4             # Abtrieb F = downforce · v² (mehr Grip bei Tempo)

[reifen]
grip = 1.9                  # Reibwert (Arcade: viel Grip)
stiffness_front = 160000.0  # N/rad
stiffness_rear = 210000.0   # hinten steifer -> stabil, leicht untersteuernd
slide_grip = 0.85           # Anteil Grip, der beim Rutschen vorne bleibt
rear_grip_factor = 1.2      # Hinterachse etwas mehr Grip als vorne -> stabil, bei Tempo in engen Kurven rutscht das Heck von selbst

[lenkung]
max_steer = 0.55            # rad Radeinschlag im Stand (~32°)
steer_speed_falloff = 20.0  # m/s: bei diesem Tempo nur noch halber Einschlag
steer_rate = 6.0            # wie schnell das Lenkrad folgt (1/s)

[drift]
drift_rear_grip = 0.75      # Grip hinten im Drift (< 1 -> Heck bricht aus)
drift_slide_grip = 0.85
drift_max_steer = 0.60      # rad Gegenlenken im Drift
drift_rate = 5.0            # wie schnell der Drift-Modus ein-/ausblendet (1/s)

[luft]
schwere = 1.3               # Schwerkraft fürs Abheben/Fliegen × diesen Faktor (Arcade: Auto fühlt sich schwer an)
abtrieb_nach_unten = 0.4    # Anteil des Abtriebs, der das Auto auch nach unten drückt (bei Tempo: klebt über Kuppen)
yaw_damping = 0.6           # 1/s: so schnell hört das Auto in der Luft auf, sich zu drehen
level_rate = 0.4            # 1/s: so schnell richtet sich das Auto in der Luft waagrecht aus (Neigung)
spin_damping = 0.3          # 1/s: so schnell hört das Auto in der Luft auf, sich zu überschlagen
landing_loss = 0.10         # Anteil Tempo, der bei einer harten Landung (senkrecht 10 m/s) verloren geht

[kollision]
step_height = 1.6           # m: höhere Kante = Hindernis (Seite eines Blocks), Auto prallt ab (Steilkurven und Rand brauchen Spielraum)
abprall = 0.3               # wie stark das Auto von einer Blockseite abprallt
max_steigung = 45.0         # Grad: steilere Flächen (z.B. die Kante am Rand) wirken wie eine Wand
rand_durchbruch = 12.0      # m/s quer in die Kante hinein: langsamer -> prallt ab, schneller -> hüpft drüber
max_vy_boden = 12.0         # m/s: so viel Tempo nach oben kann die Fahrbahn höchstens mitgeben (Rampen, Rand)

[regeln]
fall_depth = 4.0            # m: so tief unter der Strecke = runtergefallen -> Crash (R2)
stuck_seconds = 2.0         # Fahrt endet, wenn in so vielen Sekunden ...
stuck_min_progress = 1.0    # ... weniger als so viele Meter Fortschritt
wrong_way_meters = 15.0     # so weit hinter den eigenen Bestwert zurück = falsche Richtung
time_limit = 180.0          # Sekunden

[sensoren]
anzahl_strahlen = 17        # Sensorstrahlen, gleichmässig verteilt
winkel_bereich = 180.0      # Grad, von links (-90°) bis rechts (+90°)
reichweite = 100.0          # m (R5: nichts hinter der Sensorreichweite)
schrittweite = 0.5          # m: so fein tastet ein Strahl die Strecke ab
kante = 0.5                 # m Höhensprung zwischen zwei Abtastpunkten = Streckenkante
tempo_norm = 110.0          # m/s, Tempo wird für die KI durch diesen Wert geteilt
vertikal_norm = 30.0        # m/s, senkrechtes Tempo (Sprünge) / diesen Wert
